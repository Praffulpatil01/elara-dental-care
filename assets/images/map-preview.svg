<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE"/>
      <stop offset="100%" stop-color="#EBE6D9"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B40"/>
      <stop offset="100%" stop-color="#1B3830"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#mapBg)"/>
  
  <!-- Coastal Arabian Sea water accent on left -->
  <path d="M0 0 L90 0 C70 80 80 150 50 240 C30 300 60 350 40 380 L0 380 Z" fill="#DCE7E1" opacity="0.6"/>
  <text x="35" y="190" transform="rotate(-90 35 190)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#78917D" letter-spacing="2">ARABIAN SEA COAST</text>
  
  <!-- Roads and transit lines -->
  <path d="M120 0 L120 380" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M120 0 L120 380" stroke="#D3CDC0" stroke-width="1"/>
  <text x="128" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#78917D" transform="rotate(90 128 50)">VEER SAVARKAR MARG</text>

  <path d="M100 180 L600 180" stroke="#FFFFFF" stroke-width="20"/>
  <path d="M100 180 L600 180" stroke="#D3CDC0" stroke-width="1.2"/>
  <text x="210" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#566760" letter-spacing="1">CENTURY BAZAAR ROAD / S.B. MARG</text>

  <path d="M380 0 L380 380" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M380 0 L380 380" stroke="#D3CDC0" stroke-width="1"/>
  <text x="388" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#78917D" transform="rotate(90 388 70)">PRABHADEVI MAIN RD</text>

  <!-- Landmark Blocks -->
  <rect x="150" y="60" width="180" height="90" rx="8" fill="#E4DED2" opacity="0.7"/>
  <text x="240" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#566760" text-anchor="middle" font-weight="500">Century Bazaar Market</text>

  <rect x="420" y="60" width="150" height="90" rx="8" fill="#E4DED2" opacity="0.7"/>
  <text x="495" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#566760" text-anchor="middle" font-weight="500">Prabhadevi Station Dir.</text>

  <rect x="150" y="210" width="200" height="130" rx="8" fill="#E0D7C7" opacity="0.6"/>
  <text x="250" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#566760" text-anchor="middle" font-weight="500">Shree Sai Sundar Nagar</text>

  <rect x="380" y="210" width="190" height="130" rx="8" fill="#E4DED2" opacity="0.7"/>
  <text x="475" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#566760" text-anchor="middle" font-weight="500">Towards Worli Naka</text>

  <!-- Pin Pulsing Ring -->
  <circle cx="280" cy="225" r="26" fill="rgba(36, 75, 64, 0.15)"/>
  <circle cx="280" cy="225" r="16" fill="rgba(184, 154, 98, 0.3)"/>

  <!-- Main Clinic Pin -->
  <g transform="translate(262, 185)">
    <path d="M18 0 C8 0 0 8 0 18 C0 30 18 48 18 48 C18 48 36 30 36 18 C36 8 28 0 18 0 Z" fill="url(#pinGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
    <circle cx="18" cy="18" r="8" fill="#FAF8F2"/>
    <circle cx="18" cy="18" r="4" fill="#B89A62"/>
  </g>

  <!-- Clinic Callout Card -->
  <g transform="translate(240, 248)">
    <rect width="250" height="72" rx="10" fill="#244B40" filter="drop-shadow(0 6px 14px rgba(24,52,44,0.3))"/>
    <rect x="1" y="1" width="248" height="70" rx="9" fill="none" stroke="#B89A62" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="18" y="26" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="600" fill="#FAF8F2">Elara Dental Care</text>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#E3DED4">Room 27, Bldg 4, Century Bazaar</text>
    <text x="18" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#B89A62" font-weight="600">Prabhadevi, Mumbai 400025</text>
  </g>
</svg>