<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F2"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="docAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B40"/>
      <stop offset="100%" stop-color="#78917D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="20" fill="url(#docBg)"/>
  <rect x="8" y="8" width="384" height="464" rx="16" fill="none" stroke="#E3DED4" stroke-width="2"/>
  
  <!-- Subtle circular frame -->
  <circle cx="200" cy="165" r="105" fill="rgba(120, 145, 125, 0.12)" stroke="#B89A62" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Doctor silhouette -->
  <g fill="#244B40" opacity="0.88">
    <circle cx="200" cy="125" r="46"/>
    <!-- Gentle coat & clinical attire arc -->
    <path d="M120 255 C120 200 150 180 200 180 C250 180 280 200 280 255 L280 265 L120 265 Z"/>
    <path d="M175 205 L200 235 L225 205" fill="none" stroke="#FAF8F2" stroke-width="4" stroke-linecap="round"/>
    <path d="M185 225 C185 255 215 255 215 225" fill="none" stroke="#FAF8F2" stroke-width="3"/>
  </g>

  <!-- Professional Badge -->
  <g transform="translate(50, 285)">
    <rect width="300" height="145" rx="12" fill="#FFFFFF" stroke="#E3DED4" stroke-width="1.5"/>
    <text x="150" y="34" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#244B40" text-anchor="middle">Dr. Nikita More</text>
    <text x="150" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#B89A62" text-anchor="middle" letter-spacing="1.5">ELARA DENTAL CARE</text>
    <line x1="50" y1="70" x2="250" y2="70" stroke="#E3DED4" stroke-width="1"/>
    <text x="150" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#566760" text-anchor="middle" font-weight="600">Dental Surgeon</text>
    <text x="150" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#78917D" text-anchor="middle">Century Bazaar, Prabhadevi</text>
    <text x="150" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#B89A62" text-anchor="middle" font-style="italic">Personalized &amp; Gentle Care</text>
  </g>
</svg>