<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F2"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="docAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B40"/>
      <stop offset="100%" stop-color="#78917D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="20" fill="url(#docBg)"/>
  <rect x="8" y="8" width="384" height="464" rx="16" fill="none" stroke="#E3DED4" stroke-width="2"/>
  
  <!-- Subtle circular frame -->
  <circle cx="200" cy="180" r="110" fill="rgba(120, 145, 125, 0.12)" stroke="#B89A62" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Doctor silhouette -->
  <g fill="#244B40" opacity="0.85">
    <circle cx="200" cy="140" r="48"/>
    <!-- Gentle stethoscope / coat arc -->
    <path d="M120 270 C120 215 150 195 200 195 C250 195 280 215 280 270 L280 280 L120 280 Z"/>
    <path d="M175 220 L200 250 L225 220" fill="none" stroke="#FAF8F2" stroke-width="4" stroke-linecap="round"/>
    <path d="M185 240 C185 270 215 270 215 240" fill="none" stroke="#FAF8F2" stroke-width="3"/>
  </g>

  <!-- Professional Badge -->
  <g transform="translate(50, 310)">
    <rect width="300" height="120" rx="12" fill="#FFFFFF" stroke="#E3DED4" stroke-width="1.5"/>
    <text x="150" y="32" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="600" fill="#244B40" text-anchor="middle">Dr. Nikita More</text>
    <text x="150" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#B89A62" text-anchor="middle" letter-spacing="1.2">ELARA DENTAL CARE</text>
    <line x1="60" y1="64" x2="240" y2="64" stroke="#E3DED4" stroke-width="1"/>
    <text x="150" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#566760" text-anchor="middle">Dental Surgeon • Prabhadevi Clinic</text>
    <text x="150" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78917D" text-anchor="middle">Personalized & Thoughtful Care</text>
  </g>
</svg>